[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = {version = "1.0.78", features=["span-locations"]}
rustfmt-wrapper = "0.1.0"
home = "=0.5.9"
regex = "1.11.1"

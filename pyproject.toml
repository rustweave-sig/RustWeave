[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c2rustxw-cli"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "clang==18.1.8",
  #"faiss-cpu>=1.13.0",
  #"langchain[anthropic,openai]>=1.0.5",
  "python-dotenv>=1.2.1",
  "pyyaml>=6.0.3",
  "ruff>=0.14.5",
  #"torch>=2.9.1",
  #"transformers>=4.57.1",
  #"langchain-anthropic>=0.2.0",
  "pillow>=12.0.0",
  "numpy>=2.3.5",
  "openai>=2.15.0",
]

[project.scripts]
c2rust = "src.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

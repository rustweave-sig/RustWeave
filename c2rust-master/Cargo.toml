[package]
name = "c2rust"
version = "0.1.0"
edition = "2021"
authors = ["c2rust developers"]
description = "C to Rust translation and build tool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
serial_test = "3.0"
tempfile = "3"

[[bin]]
name = "c2rust-xw"
path = "src/main.rs"

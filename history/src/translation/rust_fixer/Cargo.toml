[package]
name = "rust_fixer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
syn = { version = "2.0", features = ["visit", "full", "visit-mut", "extra-traits"] }
quote = "1.0"
proc-macro2 = {version = "1.0.78", features=["span-locations"]}
rustfmt-wrapper = "0.1.0"
regex = "1.11.1"
home = "=0.5.11"
